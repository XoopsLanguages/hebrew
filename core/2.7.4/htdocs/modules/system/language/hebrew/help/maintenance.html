<h1 class="head">עזרה: תחזוקה</h1>
<h4 class="odd">תיאור</h4>
<p class="even">
        תחזוקה מספקת מספר פונקציות בסיסיות שיעזרו לך לתחזק את התקנת ה-XOOPS שלך ולשמור עליה בריאה:<br/><br/>

        - נקה תיקיית מטמון<br/>
        - רוקן את טבלת הפגישה<br/>
        - בצע תחזוקה של טבלאות מסד הנתונים (נתח, בדוק, בצע אופטימיזציה ותיקון) <br/><br/>

        ניתן גם לבצע "dump" של כל מסד הנתונים או טבלאות בודדות למטרות גיבוי. </p>
</div>
